<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .menu {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }
        .menu li {
            display: inline;
        }
        .menu a {
            text-decoration: none;
            padding: 10px;
            color: white;
            background-color: black;
            border-radius: 5px;
        }
        .menu a:hover{
            background-color: #dadada;
            color: black;
        }
    </style>
</head>
<body>
    <script src="js/menu.js"></script>
</body>
</html>
